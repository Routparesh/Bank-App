name: Java CI/CD Pipeline with Security and K8s Deployment

on:
  push:
    branches: [ "master", "main", "start" ]
  pull_request:
    branches: [ "master", "main", "start" ]

env:
  # Replace with your Docker Hub username/repository
  IMAGE_NAME: username/bankapp

jobs:
  build-and-deploy:
    name: Build, Scan, Containerize and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Git Checkout
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Git Leaks Scanner
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 4. Compilation
      - name: Compile Application
        run: chmod +x mvnw && ./mvnw compile

      # 5. Trivy File System Scan (fscan)
      - name: Run Trivy File System Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # 6. Unit Testing
      - name: Run Unit Tests
        run: ./mvnw test

      # 7. SonarQube Analysis & Quality Gate (SonarCloud)
      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=vprofile-actions8694 \
            -Dsonar.projectKey=vprofile-actions8694_bankapp \
            -Dsonar.projectName="Bank App" \
            -Dsonar.qualitygate.wait=true

      # 9. Checkov static analysis (Dockerfile / Kubernetes configs)
      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          framework: all
          output_format: cli
          soft_fail: true

      # 10. Login to DockerHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 11. Build Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      # 12. Scan built image with Trivy
      - name: Run Trivy Container Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # 13. Generate Software Bill of Materials (SBOM)
      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0
        with:
          image: 'docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: spdx-json
          output-file: 'sbom.spdx.json'

      # 14. Update Image in Kubernetes File
      - name: Update Container Image in Kubernetes Manifest
        run: |
          sed -i "s|image: docker.io/username/bankapp:latest|image: docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/deployment.yaml

      # 15. Commit and push updated k8s manifest
      - name: Commit and Push Updated Kubernetes Manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore: update container image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push

      # 16. Slack Notification on Success
      - name: Send Slack Notification on Success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: 'good'
          SLACK_MESSAGE: 'CI/CD Pipeline succeeded for commit ${{ github.sha }}! Image has been built, scanned, and updated in Kubernetes deployment.'
          SLACK_TITLE: 'Build Succeeded'

      # 17. Slack Notification on Failure
      - name: Send Slack Notification on Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: 'danger'
          SLACK_MESSAGE: 'CI/CD Pipeline failed for commit ${{ github.sha }}. Please check the workflow run logs.'
          SLACK_TITLE: 'Build Failed'

