apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bankapp-servicemonitor
  labels:
    release: prometheus-stack # Must match your Helm release name of the Prometheus stack
spec:
  selector:
    matchLabels:
      app: bankapp
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 15s
